# Supabase CLI configuration for the linked LedgerFlow project.
# Keep secrets out of this file: link with `supabase link --project-ref <ref>`.

project_id = "cazmgqtyazqxlxawqvgtnx"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = ["./migrations"]

[auth]
enabled = true
site_url = "ledgerflow://"
additional_redirect_urls = ["ledgerflow://auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = true
port = 54323

[analytics]
enabled = false
